version: '3.9'

services:
  beegokreditplus:
    container_name: beegokreditplus
    image: beegokreditplus/dm:1.0
    build: .
    ports:
      - "9333:9333"
    environment:
      ConnectionStrings__DefaultConnection: "Host=netwkreditPlus;Database=kredit_plus;Username=postgres;Password=postgres;"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
    depends_on:
      netwkreditPlus:
        condition: service_healthy  
      rabbitmq:
        condition: service_healthy
  rabbitmq:
    container_name: kreditplus-rabbitmq
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      # - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  netwkreditPlus:
    container_name: netwkreditPlus
    image: postgres:12
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: kredit_plus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5    
    volumes:
      - pgdatakreditplus:/var/lib/postgresql/data
volumes:
  pgdatakreditplus: {}